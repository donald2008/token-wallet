[package]
name = "token-wallet"
version = "0.1.0"
description = "token-wallet 桌面部件 — AI 套餐/额度仪表盘"
edition = "2021"
rust-version = "1.77.2"
license = "Apache-2.0"

[lib]
name = "token_wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# D-030 / TESTING.md L2 技术前提: 可选 feature, 生产构建不受影响
tauri-plugin-playwright = { version = "0.4", optional = true }
# D-029: OS 钥匙串(Windows 凭据管理器 / macOS Keychain / Secret Service)
keyring = "3"
# P0-5: 真实 http 通道(Rust 侧执行, 规避 webview CORS/CSP 限制)
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "rustls-native-certs"] }
# D-020: app 侧 SQLite 由 Rust 执行(SCHEMA_SQL 单一来源来自 core)
rusqlite = { version = "0.32", features = ["bundled"] }

[features]
default = []
e2e-testing = ["dep:tauri-plugin-playwright"]
