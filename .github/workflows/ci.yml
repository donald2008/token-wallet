name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: typecheck + unit tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (pnpm 9)
        run: |
          corepack enable
          # corepack shim dir may not be on PATH on fresh runners; use corepack pnpm prefix
          corepack pnpm --version

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck
        run: corepack pnpm -r typecheck

      - name: Unit tests (core + app)
        run: corepack pnpm -r test

      - name: Build (core + app)
        run: corepack pnpm build